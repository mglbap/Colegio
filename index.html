<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Itens para o Colégio</title>
    <link rel="icon" href="school.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-6 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-1" style="color:darkmagenta; text-align: center; font-family: Brush Script MT, Brush Script Std, cursive; font-size: 35px;">Analiz Maciel da Silva Baptista</h1><br>
        <h2 style="color:blue; font-weight: bold;">Mala do Colégio</h2>
        <p class="text-sm text-slate-500 mb-6">Marca o item para registar a data/hora do envio.</p>
        
        <!-- Form para adicionar novos itens -->
        <form id="itemForm" class="flex gap-2 mb-6">
            <input type="text" id="itemInput" placeholder="Ex: Mochila, Casaco, Lancheira..." required
                   class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <button type="submit" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors">
                Adicionar
            </button>
        </form>

        <!-- Lista de itens -->
        <ul id="itemList" class="space-y-4"></ul><br>
        <p id="currentDateTime" class="text-center text-sm font-semibold text-slate-600 mb-6" style="font-family: Jazz LET, fantasy;"></p>
    </div>

    <style>
        body {
            background-image: url(mochilasnocorredordaescola.jpg);
            background-repeat: no-repeat;
            background-position: center;
            /*background-size: cover;*/
        }
    </style>

    <script>
        const form = document.getElementById('itemForm');
        const input = document.getElementById('itemInput');
        const list = document.getElementById('itemList');
        const currentDateTime = document.getElementById('currentDateTime');
        let editingItemId = null;
        let editingHistoryDate = null;

        // Carregar itens do LocalStorage
        let items = JSON.parse(localStorage.getItem('colegio_items_v2')) || [
            { id: 1, name: 'Mochila', history: [] },
            { id: 2, name: 'Garrafa de Água', history: [] },
            { id: 3, name: 'Muda de Roupa', history: [] }
        ];

        function saveAndRender() {
            localStorage.setItem('colegio_items_v2', JSON.stringify(items));
            render();
        }

        function formatDate(date = new Date()) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} às ${hours}:${minutes}`;
        }

        function dateToInputValue(value) {
            const match = value.match(/^(\d{2})\/(\d{2})\/(\d{4}) às (\d{2}):(\d{2})$/);
            return match ? `${match[3]}-${match[2]}-${match[1]}T${match[4]}:${match[5]}` : '';
        }

        function updateCurrentDateTime() {
            currentDateTime.textContent = new Intl.DateTimeFormat('pt-PT', {
                dateStyle: 'full',
                timeStyle: 'medium'
            }).format(new Date());
        }

        updateCurrentDateTime();
        setInterval(updateCurrentDateTime, 1000);

        function checkItem(id) {
            items = items.map(item => {
                if (item.id === id) {
                    // Adiciona o novo registo de data ao início do histórico do item
                    const updatedHistory = [formatDate(), ...item.history];
                    return {
                        ...item,
                        history: updatedHistory
                    };
                }
                return item;
            });
            saveAndRender();
        }

        function deleteHistoryDate(itemId, historyIndex) {
            items = items.map(item => {
                if (item.id !== itemId) {
                    return item;
                }

                const history = item.history.filter((_, index) => index !== historyIndex);
                return { ...item, history };
            });
            saveAndRender();
        }

        function editItem(id) {
            editingItemId = id;
            render();
            document.getElementById(`editItemInput-${id}`).focus();
        }

        function saveItemEdit(id) {
            const input = document.getElementById(`editItemInput-${id}`);
            const trimmedName = input.value.trim();
            if (!trimmedName) {
                alert('O nome do item não pode ficar vazio.');
                input.focus();
                return;
            }

            items = items.map(currentItem =>
                currentItem.id === id ? { ...currentItem, name: trimmedName } : currentItem
            );
            editingItemId = null;
            saveAndRender();
        }

        function cancelItemEdit() {
            editingItemId = null;
            render();
        }

        function editHistoryDate(itemId, historyIndex) {
            editingHistoryDate = { itemId, historyIndex };
            render();
            document.getElementById(`editHistoryDate-${itemId}-${historyIndex}`).focus();
        }

        function saveHistoryDate(itemId, historyIndex) {
            const input = document.getElementById(`editHistoryDate-${itemId}-${historyIndex}`);
            const date = input.value ? new Date(input.value) : null;
            if (!date || Number.isNaN(date.getTime())) {
                alert('Escolha uma data e hora válidas.');
                input.focus();
                return;
            }

            items = items.map(item => {
                if (item.id !== itemId || !item.history[historyIndex]) {
                    return item;
                }

                const history = [...item.history];
                history[historyIndex] = formatDate(date);
                return { ...item, history };
            });
            editingHistoryDate = null;
            saveAndRender();
        }

        function cancelHistoryDateEdit() {
            editingHistoryDate = null;
            render();
        }

        function renderHistoryDate(item, historyIndex, label = '') {
            const date = item.history[historyIndex];
            const isEditing = editingHistoryDate?.itemId === item.id
                && editingHistoryDate.historyIndex === historyIndex;

            return `
                ${label ? `<span class="font-medium text-green-700">${label}</span> ` : ''}
                ${isEditing ? `
                    <input type="datetime-local" id="editHistoryDate-${item.id}-${historyIndex}"
                           value="${dateToInputValue(date)}" aria-label="Data e hora do envio"
                           class="px-2 py-1 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                    <span class="ml-2 inline-flex items-center gap-2 whitespace-nowrap">
                        <button onclick="saveHistoryDate(${item.id}, ${historyIndex})"
                                class="text-blue-600 hover:text-blue-800 text-xs">Guardar</button>
                        <button onclick="cancelHistoryDateEdit()"
                                class="text-slate-500 hover:text-slate-700 text-xs">Cancelar</button>
                    </span>
                ` : `
                    ${escapeHtml(date)}
                    <button onclick="editHistoryDate(${item.id}, ${historyIndex})"
                            aria-label="Editar data" title="Editar data"
                            class="ml-2 inline-flex items-center text-blue-600 hover:text-blue-800">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8" class="w-4 h-4" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                            <path d="M16 3v4M8 3v4M3 11h18"></path>
                        </svg>
                    </button>
                    <button onclick="deleteHistoryDate(${item.id}, ${historyIndex})"
                            aria-label="Eliminar esta data" title="Eliminar esta data"
                            class="ml-1 inline-flex items-center text-slate-400 hover:text-red-600">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8" class="w-4 h-4" aria-hidden="true">
                            <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"></path>
                        </svg>
                    </button>
                `}
            `;
        }

        function render() {
            list.innerHTML = '';
            
            if (items.length === 0) {
                list.innerHTML = `<li class="text-center text-slate-400 text-sm py-4">Nenhum item na lista.</li>`;
                return;
            }

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'p-3 rounded-lg border bg-slate-50 border-slate-200';

                const hasHistory = item.history.length > 0;
                const isEditing = editingItemId === item.id;

                li.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                            ${isEditing ? '' : `
                                <!-- Checkbox sempre desmarcado para novos registos -->
                                <input type="checkbox" 
                                       onchange="checkItem(${item.id})"
                                       class="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                            `}
                            ${isEditing ? `
                                <input type="text" id="editItemInput-${item.id}" value="${escapeHtml(item.name)}"
                                       aria-label="Nome do item" required
                                       class="min-w-0 flex-1 px-2 py-1 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            ` : `
                                <span class="text-sm font-semibold text-slate-800">
                                    ${escapeHtml(item.name)}
                                </span>
                            `}
                        </div>
                        <div class="flex gap-3 shrink-0">
                            ${isEditing ? `
                                <button onclick="saveItemEdit(${item.id})" class="text-blue-600 hover:text-blue-800 text-xs">
                                    Guardar
                                </button>
                                <button onclick="cancelItemEdit()" class="text-slate-500 hover:text-slate-700 text-xs">
                                    Cancelar
                                </button>
                            ` : `
                                <button onclick="editItem(${item.id})" class="text-blue-600 hover:text-blue-800 text-xs">
                                    Editar
                                </button>
                            `}
                        </div>
                    </div>

                    <!-- Exibição do último registo e histórico -->
                    ${hasHistory ? `
                        <div class="mt-2 pl-8 text-xs text-slate-600">
                            <div>${renderHistoryDate(item, 0, 'Último envio:')}</div>
                            ${item.history.length > 1 ? `
                                <details class="mt-1">
                                    <summary class="cursor-pointer text-blue-600 hover:underline">Ver histórico anterior (${item.history.length})</summary>
                                    <ul class="mt-1 space-y-1 pl-2 border-l-2 border-slate-300">
                                        ${item.history.slice(1).map((_, index) =>
                                            `<li>${renderHistoryDate(item, index + 1)}</li>`
                                        ).join('')}
                                    </ul>
                                </details>
                            ` : ''}
                        </div>
                    ` : `
                        <div class="mt-1 pl-8 text-xs text-slate-400 italic">Nenhum registo efetuado.</div>
                    `}
                `;
                list.appendChild(li);
            });
        }

        function clearHistory(id) {
            items = items.map(item => {
                if (item.id === id) {
                    return { ...item, history: [] };
                }
                return item;
            });
            saveAndRender();
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = input.value.trim();
            if (name) {
                items.push({
                    id: Date.now(),
                    name: name,
                    history: []
                });
                input.value = '';
                saveAndRender();
            }
        });

        render();
    </script>
    <footer style="text-align: right; margin-top: 170px; font-size: 24px; font-family: Brush Script MT; color: red;">2026</footer>
</body>
</html>
